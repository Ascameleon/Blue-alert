<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BLUE ALERT — Modern Front</title>
<style>
:root{--cyan:#42d9ff;--red:#ff525d;--panel:#101c2beF;--line:#28465c}*{box-sizing:border-box}body{margin:0;background:#07111b;color:#e8f6ff;font:14px system-ui,Segoe UI,sans-serif;overflow:hidden}#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(ellipse at 50% 0,#17334a,#07111b 65%)}header,footer{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0b1724ed;border-bottom:1px solid var(--line);z-index:2}header{justify-content:space-between;flex-wrap:wrap}#brand{font-weight:900;letter-spacing:2px;color:var(--cyan)}.stat{padding:6px 10px;border:1px solid var(--line);background:#102337;border-radius:7px;font-weight:700}.stat b{color:#8ce8ff}main{position:relative;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}#hint{position:absolute;top:12px;left:12px;padding:8px 11px;background:#081724d9;border:1px solid #2b5268;border-radius:7px;color:#c9e8f4;font-size:12px;pointer-events:none}#feed{position:absolute;right:12px;top:12px;max-width:45%;padding:9px;background:#081724d9;border:1px solid var(--line);border-radius:7px;font-size:12px;color:#b9d2e0;pointer-events:none}footer{border-top:1px solid var(--line);border-bottom:0;flex-wrap:wrap;justify-content:center}.action{background:linear-gradient(#17334a,#102234);color:#e8f6ff;border:1px solid #31556d;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;min-height:40px}.action:hover{border-color:var(--cyan);color:var(--cyan)}.action:disabled{opacity:.35;cursor:not-allowed}.primary{border-color:#208ca9;color:#8ce8ff}.small{font-size:11px;color:#87a7bb}#selection{min-width:100px;color:#a8d7e8;font-size:12px}@media(max-width:600px){header{gap:5px;padding:7px} .stat{padding:5px 7px;font-size:11px}footer{gap:6px;padding:7px}.action{padding:8px;font-size:12px;min-height:36px}#feed{max-width:55%;font-size:10px}#hint{max-width:55%;font-size:10px}}
</style></head><body><div id="app"><header><div><div id="brand">BLUE ALERT <span style="color:#eaf6ff">/ MODERN FRONT</span></div><div class="small">OPÉRATION IRON HORIZON · ESCARMOUCHE</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><div class="stat">◈ <b id="credits">1200</b></div><div class="stat">⚡ <b id="power">100 / 80</b></div><div class="stat">UNITÉS <b id="count">3</b></div></div></header><main><canvas id="game"></canvas><div id="hint">Sélection : toucher une unité · Déplacement : clic droit / appui long sur le terrain</div><div id="feed">SECTEUR CONTESTÉ<br>Objectif : détruire le QG rouge.</div></main><footer><span id="selection">Aucune sélection</span><button class="action primary" data-build="rifle">＋ Escouade · 150</button><button class="action" data-build="tank">＋ Char · 350</button><button class="action" data-build="drone">＋ Drone · 250</button><button class="action" data-build="factory">＋ Usine · 500</button><button class="action" id="repair">⌁ Réparer QG · 100</button><button class="action" id="restart">↻ Recommencer</button></footer></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,credits=1200,units=[],buildings=[],bullets=[],particles=[],selected=null,gameOver=false,last=0,enemyTimer=0,creditsTimer=0,mouse={x:0,y:0},touchStart=null;
const terrain={};const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function base(side){const x=side==='blue'?W*.15:W*.85,y=H*.52;buildings.push({type:'hq',side,x,y,hp:1200,max:1200,w:74,h:58,range:200,cool:0});}
function spawn(type,side,x,y){const specs={rifle:{hp:90,speed:48,range:125,damage:9,rate:.65,r:7,cost:150},tank:{hp:300,speed:27,range:180,damage:28,rate:1.05,r:13,cost:350},drone:{hp:100,speed:60,range:155,damage:15,rate:.75,r:8,cost:250},enemy:{hp:130,speed:25,range:145,damage:13,rate:.9,r:10}};const s=specs[type]||specs.rifle;const u={type,side,x,y,hp:s.hp,max:s.hp,speed:s.speed,range:s.range,damage:s.damage,rate:s.rate,r:s.r,cool:rand(0,.5),tx:x,ty:y,selected:false};units.push(u);return u}
function start(){credits=1200;units=[];buildings=[];bullets=[];particles=[];selected=null;gameOver=false;enemyTimer=0;creditsTimer=0;base('blue');base('red');spawn('rifle','blue',W*.2,H*.48);spawn('rifle','blue',W*.2,H*.56);spawn('tank','blue',W*.24,H*.53);spawn('enemy','red',W*.79,H*.47);spawn('enemy','red',W*.79,H*.57);document.querySelector('#feed').innerHTML='SECTEUR CONTESTÉ<br>Objectif : détruire le QG rouge.';updateHud()}
function updateHud(){document.querySelector('#credits').textContent=Math.floor(credits);const b=buildings.find(b=>b.side==='blue'&&b.type==='hq');document.querySelector('#power').textContent=(b&&b.hp>0?'100 / 80':'0 / 80');document.querySelector('#count').textContent=units.filter(u=>u.side==='blue').length;document.querySelector('#selection').textContent=selected?(selected.type.toUpperCase()+' · '+Math.ceil(selected.hp)+' PV'):'Aucune sélection';document.querySelectorAll('[data-build]').forEach(b=>{const c={rifle:150,tank:350,drone:250,factory:500}[b.dataset.build];b.disabled=credits<c||gameOver})}
function msg(s){document.querySelector('#feed').innerHTML=s}
function addBuilding(type){const cost=type==='factory'?500:100;if(credits<cost||gameOver)return;credits-=cost;const hq=buildings.find(b=>b.side==='blue'&&b.type==='hq');if(!hq)return;const n=buildings.filter(b=>b.side==='blue').length;buildings.push({type,side:'blue',x:hq.x+Math.cos(n*2.4)*90,y:hq.y+Math.sin(n*2.4)*80,hp:450,max:450,w:type==='factory'?58:38,h:type==='factory'?44:35,range:0,cool:0});msg(type==='factory'?'USINE BLINDÉE OPÉRATIONNELLE':'INFRASTRUCTURE CONSTRUITE');updateHud()}
document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{const t=b.dataset.build,c={rifle:150,tank:350,drone:250,factory:500}[t];if(credits<c||gameOver)return;credits-=c;if(t==='factory'){addBuilding('factory');credits+=500;return}const h=buildings.find(b=>b.side==='blue'&&b.type==='hq');spawn(t,'blue',h.x+rand(-35,35),h.y+rand(-50,50));msg(t.toUpperCase()+' DÉPLOYÉ');updateHud()});
document.querySelector('#repair').onclick=()=>{const h=buildings.find(b=>b.side==='blue'&&b.type==='hq');if(h&&h.hp<h.max&&credits>=100&&!gameOver){credits-=100;h.hp=Math.min(h.max,h.hp+250);msg('QG RÉPARÉ');updateHud()}};
document.querySelector('#restart').onclick=start;
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function hit(p){for(let i=units.length-1;i>=0;i--){const u=units[i];if(dist(p,u)<u.r+7)return u}return null}
canvas.addEventListener('pointerdown',e=>{const p=point(e);mouse=p;touchStart={...p,time:Date.now(),id:e.pointerId};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',e=>{if(!touchStart)return;const p=point(e),u=hit(p);if(e.button===2||(touchStart&&Date.now()-touchStart.time>450)){if(selected&&selected.side==='blue'){selected.tx=p.x;selected.ty=p.y;msg('ORDRE DE DÉPLACEMENT TRANSMIS')}}else if(u){selected=u;units.forEach(v=>v.selected=v===u);msg(u.side==='blue'?'UNITÉ SÉLECTIONNÉE':'CONTACT HOSTILE — sélection impossible')}else if(selected&&selected.side==='blue'){selected.tx=p.x;selected.ty=p.y}touchStart=null;updateHud()});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
function targetFor(u){let candidates=[...units.filter(v=>v.side!==u.side),...buildings.filter(v=>v.side!==u.side)];let best=null,bd=1e9;for(const v of candidates){const d=dist(u,v);if(d<bd){bd=d;best=v}}return best}
function fire(a,b){bullets.push({x:a.x,y:a.y,tx:b.x,ty:b.y,life:.22,side:a.side,damage:a.damage||15});a.cool=a.rate||.8}
function boom(x,y){for(let i=0;i<10;i++)particles.push({x,y,vx:rand(-55,55),vy:rand(-55,55),life:rand(.2,.7),max:.7,r:rand(2,5)});}
function tick(dt){if(gameOver)return;creditsTimer+=dt;if(creditsTimer>3){credits+=35;creditsTimer=0}enemyTimer+=dt;if(enemyTimer>7){const h=buildings.find(b=>b.side==='red'&&b.type==='hq');if(h){spawn(Math.random()>.55?'tank':'enemy','red',h.x+rand(-35,20),h.y+rand(-55,55));enemyTimer=0}}
for(const u of units){u.cool-=dt;const t=targetFor(u),d=t?dist(u,t):999;if(t&&d<u.range){if(u.cool<=0)fire(u,t)}else{let tx=u.tx,ty=u.ty;if(t&&d>u.range*.8&&u.side==='red'){tx=t.x;ty=t.y}const dx=tx-u.x,dy=ty-u.y,l=Math.hypot(dx,dy);if(l>5){u.x+=dx/l*u.speed*dt;u.y+=dy/l*u.speed*dt}}u.x=Math.max(12,Math.min(W-12,u.x));u.y=Math.max(12,Math.min(H-12,u.y))}
for(const b of buildings){if(!b.range||b.hp<=0)continue;b.cool-=dt;const t=[...units.filter(u=>u.side!==b.side)].sort((a,c)=>dist(a,b)-dist(c,b))[0];if(t&&dist(t,b)<b.range&&b.cool<=0){bullets.push({x:b.x,y:b.y,tx:t.x,ty:t.y,life:.25,side:b.side,damage:12});b.cool=.8}}
for(let i=bullets.length-1;i>=0;i--){const q=bullets[i];q.life-=dt;if(q.life<=0){let targets=[...units,...buildings].filter(t=>t.side!==q.side&&t.hp>0&&Math.hypot(t.x-q.tx,t.y-q.ty)<(t.r||25)+18);if(targets.length){const t=targets[0];t.hp-=q.damage;if(t.hp<=0){boom(t.x,t.y);if(t===selected){selected=null}if(t.type==='hq'){gameOver=true;msg((t.side==='red'?'VICTOIRE ! QG ENNEMI DÉTRUIT':'DÉFAITE — QG PERDU')+'<br><button onclick="location.reload()" style="margin-top:6px">Nouvelle partie</button>')}else if(t.side==='red')credits+=35}}bullets.splice(i,1)}}
units=units.filter(u=>u.hp>0);buildings=buildings.filter(b=>b.hp>0||b.type==='hq');for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)particles.splice(i,1)}updateHud()}
function draw(){ctx.clearRect(0,0,W,H);const grd=ctx.createLinearGradient(0,0,W,H);grd.addColorStop(0,'#152a30');grd.addColorStop(.5,'#1b332f');grd.addColorStop(1,'#0e242b');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
// terrain grid
ctx.strokeStyle='#a4d0b00c';ctx.lineWidth=1;for(let x=0;x<W;x+=34){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=34){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
for(let i=0;i<22;i++){const x=(i*137+70)%Math.max(W,1),y=(i*83+40)%Math.max(H,1);ctx.fillStyle=i%3?'#6b80602b':'#9c9b6b21';ctx.beginPath();ctx.ellipse(x,y,randFixed(i,8,25),randFixed(i,4,11),.4,0,Math.PI*2);ctx.fill()}
for(const b of buildings){ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle='#0007';ctx.fillRect(-b.w/2+5,-b.h/2+8,b.w,b.h);ctx.fillStyle=b.side==='blue'?'#285a72':'#79383e';ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);ctx.fillStyle=b.side==='blue'?'#438aa2':'#b45258';ctx.fillRect(-b.w/2+5,-b.h/2+5,b.w-10,b.h-10);ctx.fillStyle='#10212c';ctx.fillRect(-b.w/2+9,-b.h/2+9,b.w-18,b.h-18);ctx.strokeStyle=b.side==='blue'?'#73dfff':'#ff9191';ctx.lineWidth=2;ctx.strokeRect(-b.w/2,-b.h/2,b.w,b.h);ctx.fillStyle='#d9f5ff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(b.type==='hq'?'COMMAND':b.type==='factory'?'ARMORY':'SUPPORT',0,4);ctx.fillStyle='#0009';ctx.fillRect(-b.w/2,-b.h/2-9,b.w,4);ctx.fillStyle=b.side==='blue'?'#4de0ff':'#ff565f';ctx.fillRect(-b.w/2,-b.h/2-9,b.w*Math.max(0,b.hp/b.max),4);ctx.restore()}
for(const u of units){ctx.save();ctx.translate(u.x,u.y);if(u.selected){ctx.strokeStyle='#80eeff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,u.r+8,u.r+5,0,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(3,5,u.r+3,u.r,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=u.side==='blue'?'#53c9ed':'#fa5b64';if(u.type==='tank'){ctx.fillRect(-u.r*1.4,-u.r*.8,u.r*2.8,u.r*1.6);ctx.fillStyle=u.side==='blue'?'#b4f1ff':'#ffc0c2';ctx.fillRect(-u.r*.25,-2,u.r*1.6,4);ctx.fillStyle=u.side==='blue'?'#53c9ed':'#fa5b64';ctx.beginPath();ctx.arc(-1,0,u.r*.65,0,Math.PI*2);ctx.fill()}else if(u.type==='drone'){ctx.rotate(Math.PI/4);ctx.fillRect(-u.r*.65,-u.r*.65,u.r*1.3,u.r*1.3);ctx.fillStyle='#e7fbff';ctx.fillRect(-u.r*1.7,-2,u.r*3.4,4)}else{ctx.beginPath();ctx.arc(0,0,u.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#effbff';ctx.fillRect(-2,-u.r-3,4,6)}ctx.fillStyle='#0009';ctx.fillRect(-u.r-2,-u.r-9,(u.r+2)*2,3);ctx.fillStyle=u.side==='blue'?'#57e3ff':'#ff646b';ctx.fillRect(-u.r-2,-u.r-9,(u.r+2)*2*Math.max(0,u.hp/u.max),3);ctx.restore()}
for(const q of bullets){ctx.strokeStyle=q.side==='blue'?'#a4f3ff':'#ff858a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.tx,q.ty);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.tx,q.ty,2.5,0,Math.PI*2);ctx.fill()}
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle='#ffbd6a';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
if(selected){ctx.strokeStyle='#8ce8ff55';ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(selected.x,selected.y,selected.range,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
// compact minimap
const mw=Math.min(118,W*.24),mh=mw*.62,mx=W-mw-12,my=H-mh-12;ctx.fillStyle='#06121ddd';ctx.fillRect(mx,my,mw,mh);ctx.strokeStyle='#5d8ca3';ctx.strokeRect(mx,my,mw,mh);for(const b of buildings){ctx.fillStyle=b.side==='blue'?'#4edbff':'#ff5962';ctx.fillRect(mx+b.x/W*mw-2,my+b.y/H*mh-2,4,4)}for(const u of units){ctx.fillStyle=u.side==='blue'?'#a4f4ff':'#ff9b9f';ctx.fillRect(mx+u.x/W*mw-1,my+u.y/H*mh-1,2,2)}
}
function randFixed(i,a,b){const x=Math.sin(i*127.1+311.7)*43758.5453;return a+(x-Math.floor(x))*(b-a)}
function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;tick(dt);draw();requestAnimationFrame(frame)}start();requestAnimationFrame(frame);
})();
</script></body></html>
