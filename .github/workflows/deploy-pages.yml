name: Deploy BLUE ALERTS web game
on:
  push:
    branches: [main]
    paths:
      - 'BLUE_ALERTS.html'
      - 'BLUE_ALERTS_v94_ASSET_INTEGRATION.html'
      - 'game-data/models/**'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static game
        run: |
          mkdir -p site/game-data/models
          cp BLUE_ALERTS_v94_ASSET_INTEGRATION.html site/index.html
          cp game-data/models/blue-alert-models.js site/game-data/models/blue-alert-models.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
