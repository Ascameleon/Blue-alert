name: Deploy BLUE ALERTS web game
on:
  push:
    branches: [main]
    paths:
      - 'BLUE_ALERTS.html'
      - 'BLUE_ALERTS_v94_ASSET_INTEGRATION.html'
      - 'game-data/models/**'
      - 'public/vendor/**'
      - 'scripts/prepare-pages-site.sh'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static game with offline assets
        run: bash scripts/prepare-pages-site.sh site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
