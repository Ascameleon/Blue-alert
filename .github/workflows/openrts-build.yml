name: OpenRTS build validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".gitmodules"
      - "engine/OpenRTS"
      - ".github/workflows/openrts-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and RTS engine
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: engine/OpenRTS/**/*.gradle*
      - name: Verify submodule checkout
        run: |
          test -f engine/OpenRTS/gradlew
          git -C engine/OpenRTS rev-parse HEAD
      - name: Build OpenRTS
        working-directory: engine/OpenRTS
        run: ./gradlew --no-daemon build
