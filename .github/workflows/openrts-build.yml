name: OpenRTS build validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: openrts-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository and RTS engine
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: engine/OpenRTS/**/*.gradle*
      - name: Verify submodule checkout
        run: |
          test -f engine/OpenRTS/gradlew
          test -x engine/OpenRTS/gradlew
          git -C engine/OpenRTS rev-parse HEAD
      - name: Patch OpenRTS ramp serialization compatibility
        run: python3 integration/patch_openrts_ramp_serialization.py engine/OpenRTS/core/src/model/battlefield/map/cliff/Ramp.java
      - name: Patch OpenRTS animation control compatibility
        run: python3 integration/patch_openrts_animation_performer.py engine/OpenRTS/core/src/view/acting/AnimationPerformer.java
      - name: Patch OpenRTS ground motion compatibility
        run: python3 integration/patch_openrts_ground_motion.py engine/OpenRTS/core/src/model/battlefield/army/motion/CollisionManager.java
      - name: Validate BLUE ALERTS prototype
        run: python3 scripts/validate_prototype.py
      - name: Validate BLUE ALERTS v94 3D prototype
        run: python3 scripts/validate_v94.py
      - name: Validate expanded BLUE ALERTS model kit
        run: python3 scripts/validate_model_kit.py
      - name: Validate supplied BLUE ALERTS v93 when imported
        shell: bash
        run: |
          if [ -f BLUE_ALERTS_v93_COLLISION_FRAME_FIX.html ]; then
            python3 scripts/validate_v93.py BLUE_ALERTS_v93_COLLISION_FRAME_FIX.html
          else
            echo 'v93 source is not yet committed; its local syntax check was performed separately.'
          fi
      - name: Validate BLUE ALERTS skirmish data
        run: python3 scripts/validate_scenario.py
      - name: Prepare BLUE ALERTS OpenRTS skirmish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts engine/OpenRTS/core/src/app
          python3 integration/create_openrts_scenario.py \
            engine/OpenRTS/core/assets/maps/test.btf \
            engine/OpenRTS/core/assets/maps/blue-alerts-skirmish.btf \
            engine/OpenRTS/core/assets/data/army \
            artifacts/blue-alerts-scenario-report.json
          cp integration/BlueAlertsSkirmish.java engine/OpenRTS/core/src/app/BlueAlertsSkirmish.java
          cp integration/BlueAlertsInteractiveSmoke.java engine/OpenRTS/core/src/app/BlueAlertsInteractiveSmoke.java
          test -s engine/OpenRTS/core/assets/maps/blue-alerts-skirmish.btf
          test -s engine/OpenRTS/core/src/app/BlueAlertsInteractiveSmoke.java
          test -s engine/OpenRTS/core/src/app/BlueAlertsSkirmish.java

      - name: Set up Node 22 for browser visual tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Build standalone playable V94 HTML
        run: node scripts/build_single_html.mjs
      - name: Render 3D model preview at desktop and mobile sizes
        run: node scripts/validate_model_preview_browser.mjs
      - name: Render playable v94 game at desktop and mobile sizes
        run: node scripts/validate_v94_browser.mjs
      - name: Upload playable single-file V94 HTML
        uses: actions/upload-artifact@v4
        with:
          name: blue-alerts-v94-build-zone-playable
          path: |
            dist/BLUE_ALERTS_V94_BUILD_ZONE_JOUABLE.html
            dist/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Build OpenRTS
        working-directory: engine/OpenRTS
        run: ./gradlew --no-daemon build
      - name: Install virtual display and screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth xdotool imagemagick x11-utils
      - name: Launch BLUE ALERTS skirmish and capture graphical evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cat > /tmp/openrts-smoke.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          export ALSOFT_DRIVERS=null
          cd "$GITHUB_WORKSPACE/engine/OpenRTS"
          ./gradlew --no-daemon -I "$GITHUB_WORKSPACE/integration/openrts-run-bluealerts.gradle" :core:run > "$GITHUB_WORKSPACE/artifacts/openrts-launch.log" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            pkill -P "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 10); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "BLUE ALERTS skirmish exited during startup."
              cat "$GITHUB_WORKSPACE/artifacts/openrts-launch.log"
              exit 1
            fi
            sleep 1
          done
          movement_deadline=$((SECONDS + 20))
          while ! grep -q "BLUE ALERTS movement smoke test: 12/12 units moved." "$GITHUB_WORKSPACE/artifacts/openrts-launch.log"; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "BLUE ALERTS skirmish exited before all 12 units moved."
              cat "$GITHUB_WORKSPACE/artifacts/openrts-launch.log"
              exit 1
            fi
            if (( SECONDS >= movement_deadline )); then
              echo "Timed out waiting for all 12 BLUE ALERTS units to move."
              cat "$GITHUB_WORKSPACE/artifacts/openrts-launch.log"
              exit 1
            fi
            sleep 1
          done
          # Capture immediately after the movement assertion, before the two
          # factions can finish their unattended combat and leave an empty map.
          sleep 2
          import -window root "$GITHUB_WORKSPACE/artifacts/openrts-screen.png"
          test -s "$GITHUB_WORKSPACE/artifacts/openrts-screen.png"
          test "$(stat -c%s "$GITHUB_WORKSPACE/artifacts/openrts-screen.png")" -gt 10000
          test -s "$GITHUB_WORKSPACE/artifacts/blue-alerts-scenario-report.json"
          grep -q "switching controller to BattlefieldController" "$GITHUB_WORKSPACE/artifacts/openrts-launch.log"
          grep -q "battlefield controller online" "$GITHUB_WORKSPACE/artifacts/openrts-launch.log"
          grep -q "BLUE ALERTS runtime loaded 12 units" "$GITHUB_WORKSPACE/artifacts/openrts-launch.log"
          grep -q "BLUE ALERTS movement smoke test: 12/12 units moved." "$GITHUB_WORKSPACE/artifacts/openrts-launch.log"
          if grep -Eq "SEVERE: Uncaught exception|Uncaught exception thrown in Thread|Exception: java.lang" "$GITHUB_WORKSPACE/artifacts/openrts-launch.log"; then
            echo "BLUE ALERTS runtime exception detected."
            cat "$GITHUB_WORKSPACE/artifacts/openrts-launch.log"
            exit 1
          fi
          echo "BLUE ALERTS battlefield controller loaded 12 units and ran without an uncaught exception; graphical evidence captured."
          SCRIPT
          chmod +x /tmp/openrts-smoke.sh
          xvfb-run -a -s "-screen 0 1280x720x24" /tmp/openrts-smoke.sh
      - name: Verify native mouse selection, movement and attack
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x900x24" bash integration/run_openrts_interactive_smoke.sh
      - name: Upload graphical smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrts-graphical-smoke-test
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
