name: Validate game-dev agent skills
on:
  push:
    paths:
      - '.agents/skills/**'
      - 'AGENTS.md'
      - 'scripts/validate_agent_skills.py'
      - '.github/workflows/validate-agent-skills.yml'
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'AGENTS.md'
      - 'scripts/validate_agent_skills.py'
      - '.github/workflows/validate-agent-skills.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate installed Agent Skills
        run: python scripts/validate_agent_skills.py
